# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.artihcus.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS - Port 443
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name api.artihcus.com;

    ssl_certificate /etc/letsencrypt/live/api.artihcus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.artihcus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CORS is handled by backend Express - don't add headers here to avoid duplicates
    # Backend will handle OPTIONS preflight requests and CORS headers

    # Proxy to backend on port 5000
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploads (images and documents) to backend
    location /uploads {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache headers for static files
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1h;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}

