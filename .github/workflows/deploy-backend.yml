name: Build and Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/hr-backend:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/hr-backend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/hr-backend:buildcache,mode=max

    - name: Verify Pushed Image
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/hr-backend:latest

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
    
    - name: Deploy to server
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        ssh -o StrictHostKeyChecking=accept-new ${SERVER_USER}@${SERVER_IP} << EOF
        set -e
        cd /data/backend
        
        
        # Update .env with email credentials
        if ! grep -q "EMAIL_USER" .env 2>/dev/null; then
          echo "" >> .env
          echo "# Email Configuration" >> .env
          echo "EMAIL_USER=${EMAIL_USER}" >> .env
          echo "EMAIL_PASSWORD=${EMAIL_PASSWORD}" >> .env
        else
          sed -i "s|EMAIL_USER=.*|EMAIL_USER=${EMAIL_USER}|" .env
          sed -i "s|EMAIL_PASSWORD=.*|EMAIL_PASSWORD=${EMAIL_PASSWORD}|" .env
        fi
        
        # Create/Update docker-compose.prod.yml on the server
        cat << 'DC' > docker-compose.prod.yml
        version: '3.8'

        services:
          # Backend API Service
          # Note: MongoDB is installed on the server (not in Docker)
          # Using host network mode to access MongoDB on localhost:27017
          backend:
            # Image from Docker Hub
            image: harshava123/hr-backend:latest
            container_name: hr-backend-prod
            restart: unless-stopped
            network_mode: host
            environment:
              - NODE_ENV=production
              - MONGODB_URI=${MONGODB_URI}
              - PORT=5000
              - JWT_SECRET=${JWT_SECRET}
              - FRONTEND_URL=${FRONTEND_URL}
              - EMAIL_USER=${EMAIL_USER}
              - EMAIL_PASSWORD=${EMAIL_PASSWORD}
            volumes:
              - ./logs:/app/logs
        DC
        # Fix indentation (strip leading 8 spaces from workflow indentation)
        sed -i 's/^        //' docker-compose.prod.yml
        
        # Robust Deployment Sequence for Docker Compose V2
        # 1. Pull latest image specifically for the prod config
        docker compose -f docker-compose.prod.yml pull
        
        # 2. Recreate containers (up -d handles stop/recreate if image changed)
        docker compose -f docker-compose.prod.yml up -d
        
        # 3. Cleanup unused images to save space
        docker image prune -f
        
        sleep 5
        docker ps
        EOF
    
    - name: Verify deployment
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
      run: |
        sleep 10
        ssh -o StrictHostKeyChecking=accept-new ${SERVER_USER}@${SERVER_IP} << 'EOF'
        echo "=== Checking Docker Containers ==="
        docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.CreatedAt}}"
        echo ""
        echo "=== Checking Current Container Image ==="
        CONTAINER_IMAGE=$(docker inspect hr-backend-prod --format='{{.Image}}' 2>/dev/null || echo "N/A")
        LATEST_IMAGE=$(docker images harshava123/hr-backend:latest --format='{{.ID}}' 2>/dev/null || echo "N/A")
        echo "Container Image ID: $CONTAINER_IMAGE"
        echo "Latest Image ID: $LATEST_IMAGE"
        echo ""
        echo "=== Pulling Latest Image ==="
        docker pull harshava123/hr-backend:latest
        echo ""
        echo "=== Verifying Health Endpoint ==="
        curl -f http://127.0.0.1:3000/api/health || curl -f http://127.0.0.1:5000/api/auth/me || echo "Health check skipped (auth/me requires token)"
        echo ""
        echo "=== Checking if Container Uses Latest Image ==="
        # Note: 'docker images' ID might differ from 'docker inspect' if pulled separately? 
        # But logically they should match if 'docker compose pull' updated it.
        if [ "$CONTAINER_IMAGE" != "$LATEST_IMAGE" ] && [ "$CONTAINER_IMAGE" != "N/A" ]; then
          echo "⚠️  Container may need restart to use latest image"
        else
          echo "✅ Container is using latest image"
        fi
        EOF
