# Nginx Configuration for api.artihcus.com
# Handles ports 80, 443, and 8443
# Delegates CORS handling to the Node.js backend

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.artihcus.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS on Port 443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.artihcus.com;

    ssl_certificate /etc/letsencrypt/live/api.artihcus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.artihcus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to backend (captures /api and root)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Crucial: Pass the Origin header so Express can ignore/validate it
        proxy_set_header Origin $http_origin; 
    }
}

# HTTPS on Port 8443 (Alternate Port)
# Replicates 443 config exactly
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name api.artihcus.com;

    ssl_certificate /etc/letsencrypt/live/api.artihcus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.artihcus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to backend (captures /api and root)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Crucial: Pass the Origin header
        proxy_set_header Origin $http_origin;
        
        # Do NO CORS handling here. Let the backend do it.
    }
}
